<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };

        // Live theme sync with the reader: its toggle writes 'editor-theme-preference'
        // to localStorage, which fires a storage event inside every slide iframe.
        window.addEventListener('storage', function (event) {
            if (event.key === 'editor-theme-preference' && (event.newValue === 'dark' || event.newValue === 'light')) {
                document.documentElement.classList.toggle('dark', event.newValue === 'dark');
            }
        });
    </script>
    <link rel="stylesheet" href="bec.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .vocab-stage { display: flex; flex-direction: column; gap: clamp(0.55rem, 1.6vh, 1rem); width: 100%; height: 100%; justify-content: center; }
        .vocab-grid-sm { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        @media (max-width: 560px) { .bec-vocab-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body class="h-full overflow-hidden">
<div class="bec-slide">
    <div class="bec-glow"></div>

    <div class="bec-stage">
        <div class="vocab-stage" style="max-width:940px">
            <div class="bec-header reveal">
                <span class="bec-kicker">Slide 10 · Words to Remember</span>
                <h1 class="bec-title">New <span class="accent">Vocabulary:</span></h1>
            </div>

            <!-- 12 vocabulary cards, 6 per view with internal pagination.
                 Each card: image slot (top), word, meaning, example, audio button.
                 ═══ TECH LEAD — MEDIA INTEGRATION ═══
                 1) Images: give every card a photo by setting img in VOCAB below
                    (hosted URL) — the dashed slot is replaced by the picture.
                 2) Audio: set audio in VOCAB (or VOCAB_AUDIO) to enable the
                    card's listen button. No TTS fallback by design. -->
            <div class="bec-vocab-wrap reveal">
                <button class="bec-pager-arrow" id="pg-prev" aria-label="Previous words">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="bec-vocab-grid" id="vocab-grid"></div>
                <button class="bec-pager-arrow" id="pg-next" aria-label="Next words">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
            <div class="flex items-center justify-center gap-2 reveal">
                <span class="bec-pager-count" id="pg-count">Page 1 / 2</span>
            </div>
        </div>
    </div>
</div>

<script>
    /* ═══ TECH LEAD: fill img / audio per word when assets are hosted ═══ */
    const VOCAB = [
        { word: "Saving account/ current account", meaning: "a bank account for keeping money safe", example: "I keep my money in a savings account." },
        { word: "deposi", meaning: "to put money into your account", example: "I deposit $500 at the bank." },
        { word: "withdraw", meaning: "to take money out of your account", example: "I withdraw $50 from the ATM." },
        { word: "bank statement", meaning: "a document showing money in and out", example: "Check your bank statement every month." },
        { word: "balance", meaning: "the amount of money you have in the bank", example: "My balance is $500." },
        { word: "sign", meaning: "to write your name on a document", example: "Please sign here." },
        { word: "transfer", meaning: "to move money from one bank to another", example: "I transfer money to my brother." },
        { word: "overdraw", meaning: "to take out more money than you have", example: "Don’t overdraw your account." },
        { word: "bank statement", meaning: "a document showing money in and out", example: "Check your bank statement every month." },
        { word: "bank branch", meaning: "a bank office in your city", example: "Visit the nearest bank branch." },
        { word: "transactions", meaning: "money going in and out of your account", example: "You made three transactions today." },
        { word: "ATM", meaning: "a machine that gives you money", example: "Get cash from the ATM." }
    ];
    const PER_PAGE = 6;

    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('vocab-grid');
        let page = 0;
        const pages = Math.ceil(VOCAB.length / PER_PAGE);

        function render() {
            grid.innerHTML = '';
            VOCAB.slice(page * PER_PAGE, (page + 1) * PER_PAGE).forEach(v => {
                const card = document.createElement('div');
                card.className = 'bec-vocab';
                const img = v.img
                    ? `<div class="bec-vocab-img"><img src="${v.img}" alt="${v.word}"></div>`
                    : `<div class="bec-vocab-img" title="Image placeholder — tech lead connects the hosted photo">
                           <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
                       </div>`;
                const audioBtn = v.audio
                    ? `<button class="bec-vocab-audio" data-audio="${v.audio}">▶ Listen</button>`
                    : `<button class="bec-vocab-audio" disabled>▶ Listen</button>`;
                card.innerHTML = `
                    ${img}
                    <div class="bec-vocab-body">
                        <p class="bec-vocab-word">${v.word}</p>
                        <p class="bec-vocab-meaning">${v.meaning}</p>
                        <p class="bec-vocab-example">“${v.example}”</p>
                        ${audioBtn}
                    </div>`;
                grid.appendChild(card);
            });
            document.getElementById('pg-count').textContent = `Page ${page + 1} / ${pages}`;
            document.getElementById('pg-prev').disabled = page === 0;
            document.getElementById('pg-next').disabled = page === pages - 1;
        }

        document.getElementById('pg-prev').addEventListener('click', () => { if (page > 0) { page--; render(); } });
        document.getElementById('pg-next').addEventListener('click', () => { if (page < pages - 1) { page++; render(); } });

        let current = null;
        grid.addEventListener('click', (e) => {
            const btn = e.target.closest('.bec-vocab-audio');
            if (!btn || !btn.dataset.audio) return;
            if (current) { current.pause(); current.currentTime = 0; }
            const audio = new Audio(btn.dataset.audio);
            current = audio;
            audio.play();
        });

        window.stopSlideAudio = function stopSlideAudio() { if (current) { current.pause(); current.currentTime = 0; } };
        window.resetSlide = function resetSlide() { page = 0; render(); };

        render();

        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (window.gsap && !reduced) {
            gsap.timeline().from('.reveal', { opacity: 0, y: 10, duration: 0.35, stagger: 0.1, ease: 'power2.out', clearProps: 'all' });
        }
    });
</script>
</body>
</html>
