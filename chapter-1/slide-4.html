<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };

        // Live theme sync with the reader: its toggle writes 'editor-theme-preference'
        // to localStorage, which fires a storage event inside every slide iframe.
        window.addEventListener('storage', function (event) {
            if (event.key === 'editor-theme-preference' && (event.newValue === 'dark' || event.newValue === 'light')) {
                document.documentElement.classList.toggle('dark', event.newValue === 'dark');
            }
        });
    </script>
    <link rel="stylesheet" href="bec.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-hidden">
<div class="bec-slide">
    <div class="bec-glow"></div>

    <div class="bec-stage" style="gap: clamp(0.7rem, 2vh, 1.3rem)">
        <div class="bec-header reveal">
            <span class="bec-kicker">Slide 04 · Let's Talk</span>
            <h1 class="bec-title">Warm-up <span class="accent">Questions</span></h1>
            <p class="bec-sub">Talk about these questions with your teacher.</p>
        </div>

        <!-- Discussion prompts: one at a time, teacher-led (no scoring) -->
        <div class="bec-card bec-quiz reveal" style="width:min(640px,100%)">
            <div class="bec-quiz-top">
                <p class="bec-quiz-instruction">Discuss together:</p>
                <span class="bec-qcount" id="q-count">1 of 3</span>
            </div>

            <div class="bec-progress"><div class="bec-progress-fill" id="talk-progress"></div></div>

            <p class="bec-question" id="q-text">What kind of bills can you see?</p>

            <div class="bec-quiznav" style="margin-top:0.35rem">
                <button class="bec-btn bec-btn-outline" id="btn-prev">Previous Question</button>
                <button class="bec-btn bec-btn-primary" id="btn-next">Next Question</button>
            </div>
        </div>
    </div>
</div>

<script>
    const QUESTIONS = [
        "What kind of bills can you see?",
        "How often do you pay your bills?",
        "Do you need to go the bank to pay your bills?"
    ];

    document.addEventListener('DOMContentLoaded', () => {
        const $ = (id) => document.getElementById(id);
        let current = 0;
        const visited = new Set([0]);

        function render() {
            $('q-text').textContent = QUESTIONS[current];
            $('q-count').textContent = `${current + 1} of ${QUESTIONS.length}`;
            $('talk-progress').style.width = `${(current + 1) / QUESTIONS.length * 100}%`;
            $('btn-prev').disabled = current === 0;
            $('btn-next').textContent = current === QUESTIONS.length - 1 ? 'Finish' : 'Next Question';
        }

        $('btn-next').addEventListener('click', () => { if (current < QUESTIONS.length - 1) { current++; visited.add(current); render(); } });
        $('btn-prev').addEventListener('click', () => { if (current > 0) { current--; render(); } });

        window.resetSlide = function resetSlide() { current = 0; visited.clear(); visited.add(0); render(); };
        render();

        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (window.gsap && !reduced) {
            gsap.timeline().from('.reveal', { opacity: 0, y: 10, duration: 0.35, stagger: 0.12, ease: 'power2.out', clearProps: 'all' });
        }
    });
</script>
</body>
</html>
