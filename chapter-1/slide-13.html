<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };

        // Live theme sync with the reader: its toggle writes 'editor-theme-preference'
        // to localStorage, which fires a storage event inside every slide iframe.
        window.addEventListener('storage', function (event) {
            if (event.key === 'editor-theme-preference' && (event.newValue === 'dark' || event.newValue === 'light')) {
                document.documentElement.classList.toggle('dark', event.newValue === 'dark');
            }
        });
    </script>
    <link rel="stylesheet" href="bec.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .wrap-card { width: min(620px, 100%); display: flex; flex-direction: column; gap: clamp(0.55rem, 1.6vh, 1rem); padding: clamp(1rem, 3vh, 1.8rem); }
        .wrap-thanks { text-align: center; font-size: clamp(1.5rem, 4.2vh, 2.6rem); font-weight: 900; font-style: italic; letter-spacing: -0.02em; background: linear-gradient(100deg, var(--bec-brand), #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .wrap-item { display: flex; align-items: flex-start; gap: 0.75rem; }
        .wrap-check { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: clamp(1.7rem, 4vh, 2.2rem); height: clamp(1.7rem, 4vh, 2.2rem); border-radius: 9999px; background: var(--bec-good-soft); color: var(--bec-good); }
        .wrap-q { font-size: clamp(0.8rem, 1.9vh, 1.05rem); font-weight: 800; line-height: 1.45; padding-top: 0.15rem; }
    </style>
</head>
<body class="h-full overflow-hidden">
<div class="bec-slide">
    <div class="bec-glow"></div>

    <div class="bec-stage" style="gap: clamp(0.6rem, 1.8vh, 1.1rem)">
        <div class="bec-header reveal">
            <span class="bec-kicker">Slide 13 · Lesson Review</span>
            <h1 class="bec-title">Wrap <span class="accent">up!</span></h1>
        </div>

        <div class="bec-card wrap-card reveal">
            <div class="bec-obj-list" style="width:100%;gap:clamp(0.5rem,1.5vh,0.9rem)">
                <div class="wrap-item">
                    <span class="wrap-check">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    </span>
                    <p class="wrap-q">What can you say when you want to pay your bill?</p>
                </div>
                <div class="wrap-item">
                    <span class="wrap-check">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    </span>
                    <p class="wrap-q">How can you say you want to open a bank account?</p>
                </div>
                <div class="wrap-item">
                    <span class="wrap-check">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    </span>
                    <p class="wrap-q">What does “Cut your coat according to your cloth” mean?</p>
                </div>
            </div>
            <p class="wrap-thanks">Thank You</p>
            <p class="bec-sub" style="text-align:center">End of Lesson 3 — Paying Bills</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        window.resetSlide = function resetSlide() {};

        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (window.gsap && !reduced) {
            gsap.timeline()
                .from('.reveal', { opacity: 0, y: 10, duration: 0.35, stagger: 0.12, ease: 'power2.out', clearProps: 'all' })
                .from('.wrap-item', { opacity: 0, x: -8, duration: 0.3, stagger: 0.12, ease: 'power2.out', clearProps: 'all' }, '-=0.4');
        }
    });
</script>
</body>
</html>
