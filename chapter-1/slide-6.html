<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };

        // Live theme sync with the reader: its toggle writes 'editor-theme-preference'
        // to localStorage, which fires a storage event inside every slide iframe.
        window.addEventListener('storage', function (event) {
            if (event.key === 'editor-theme-preference' && (event.newValue === 'dark' || event.newValue === 'light')) {
                document.documentElement.classList.toggle('dark', event.newValue === 'dark');
            }
        });
    </script>
    <link rel="stylesheet" href="bec.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-hidden">
<div class="bec-slide">
    <div class="bec-glow"></div>

    <div class="bec-stage">
        <div class="bec-header reveal">
            <span class="bec-kicker">Slide 06 · Check Understanding</span>
            <h1 class="bec-title">Interactive <span class="accent">video quiz</span></h1>
        </div>

        <div class="bec-statbar reveal">
            <div class="bec-stat"><span class="bec-stat-label">Progress</span><span class="bec-stat-value" id="stat-progress">0/5</span></div>
            <div class="bec-stat is-good"><span class="bec-stat-label">Correct</span><span class="bec-stat-value" id="stat-correct">0</span></div>
            <div class="bec-stat is-bad"><span class="bec-stat-label">Mistakes</span><span class="bec-stat-value" id="stat-mistakes">0</span></div>
        </div>

        <div class="bec-card bec-quiz reveal">
            <div class="bec-quiz-top">
                <p class="bec-quiz-instruction">Choose the correct answer:</p>
                <span class="bec-qcount" id="q-count">1 of 5</span>
            </div>

            <div class="bec-progress"><div class="bec-progress-fill" id="quiz-progress"></div></div>

            <p class="bec-question" id="q-text">Why does the customer go to the bank?</p>

            <div class="bec-answers" id="answers"></div>

            <p class="bec-feedback" id="feedback">&nbsp;</p>

            <div class="bec-quiznav">
                <button class="bec-btn bec-btn-outline" id="btn-restart">Restart Quiz</button>
                <button class="bec-btn bec-btn-outline" id="btn-prev">Previous Question</button>
                <button class="bec-btn bec-btn-primary" id="btn-next">Next Question</button>
            </div>
        </div>
    </div>
</div>

<script>
    const QUESTIONS = [
        { q: "Why does the customer go to the bank?", opts: ["To open a new account", "To pay the electric bill", "To buy a new card", "To send a letter"], answer: 1 },
        { q: "What does the teller ask the customer to show?", opts: ["A passport", "The bill", "A photo", "A phone"], answer: 1 },
        { q: "How much is the bill?", opts: ["45.60 dollars", "15 dollars", "100 dollars", "5.60 dollars"], answer: 0 },
        { q: "How does the customer pay?", opts: ["By cash", "By check", "By card", "Online"], answer: 2 },
        { q: "What does the teller give at the end?", opts: ["A new account", "A receipt", "A bill", "A credit card"], answer: 1 }
    ];
    const LETTERS = ["A", "B", "C", "D"];

    document.addEventListener('DOMContentLoaded', () => {
        const $ = (id) => document.getElementById(id);
        const answersEl = $('answers'), qText = $('q-text'), qCount = $('q-count'), fb = $('feedback');
        const statProgress = $('stat-progress'), statCorrect = $('stat-correct'), statMistakes = $('stat-mistakes');
        const progressFill = $('quiz-progress');

        let current = 0;
        let results = Array(QUESTIONS.length).fill(null);
        let selections = Array(QUESTIONS.length).fill(null);
        let buttons = [];

        function buildAnswers() {
            answersEl.innerHTML = '';
            buttons = [];
            QUESTIONS[current].opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'bec-ans';
                btn.innerHTML = `<span style="opacity:0.55;font-weight:900">${LETTERS[i]}.</span> ${opt}`;
                btn.addEventListener('click', () => pick(i));
                answersEl.appendChild(btn);
                buttons.push(btn);
            });
        }

        function pick(i) {
            if (results[current] !== null) return;
            selections[current] = i;
            results[current] = (i === QUESTIONS[current].answer) ? 'correct' : 'wrong';
            renderAnswered(false);
            refreshStats();
        }

        function renderAnswered(silent) {
            const ans = QUESTIONS[current].answer;
            buttons.forEach((btn, i) => {
                btn.classList.remove('is-selected', 'is-correct', 'is-wrong', 'is-locked');
                btn.classList.add('is-locked');
                if (i === ans) btn.classList.add('is-correct');
                else if (i === selections[current] && results[current] === 'wrong') btn.classList.add('is-wrong');
            });
            if (!silent) {
                if (results[current] === 'correct') { fb.className = 'bec-feedback is-good'; fb.textContent = 'Correct! Well done.'; }
                else { fb.className = 'bec-feedback is-bad'; fb.textContent = 'Not quite — the correct answer is highlighted.'; }
            }
        }

        function renderQuestion() {
            const q = QUESTIONS[current];
            qText.textContent = q.q;
            qCount.textContent = `${current + 1} of ${QUESTIONS.length}`;
            fb.className = 'bec-feedback'; fb.innerHTML = '&nbsp;';
            buildAnswers();
            if (results[current] !== null) renderAnswered(true);
            else if (selections[current] !== null) buttons[selections[current]].classList.add('is-selected');
            $('btn-prev').disabled = current === 0;
            $('btn-next').textContent = current === QUESTIONS.length - 1 ? 'Finish' : 'Next Question';
        }

        function refreshStats() {
            const answered = results.filter(r => r !== null).length;
            statProgress.textContent = `${answered}/${QUESTIONS.length}`;
            statCorrect.textContent = results.filter(r => r === 'correct').length;
            statMistakes.textContent = results.filter(r => r === 'wrong').length;
            progressFill.style.width = `${(answered / QUESTIONS.length) * 100}%`;
        }

        $('btn-next').addEventListener('click', () => {
            if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
            else {
                const answered = results.filter(r => r !== null).length;
                fb.className = 'bec-feedback is-info';
                fb.textContent = answered === QUESTIONS.length
                    ? `Finished — ${statCorrect.textContent} correct, ${statMistakes.textContent} mistake(s).`
                    : `${QUESTIONS.length - answered} question(s) left — answer them all to finish.`;
            }
        });
        $('btn-prev').addEventListener('click', () => { if (current > 0) { current--; renderQuestion(); } });

        function fullReset() {
            current = 0;
            results = Array(QUESTIONS.length).fill(null);
            selections = Array(QUESTIONS.length).fill(null);
            refreshStats();
            renderQuestion();
        }
        $('btn-restart').addEventListener('click', fullReset);
        window.resetSlide = fullReset;

        refreshStats();
        renderQuestion();

        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (window.gsap && !reduced) {
            gsap.timeline().from('.reveal', { opacity: 0, y: 10, duration: 0.35, stagger: 0.09, ease: 'power2.out', clearProps: 'all' });
        }
    });
</script>
</body>
</html>
