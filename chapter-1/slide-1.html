<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui']
                    }
                }
            }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}

            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }

            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-x-hidden">
<div class="isolate relative min-h-[100dvh] overflow-x-hidden overflow-y-auto bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
    <div class="pointer-events-none fixed inset-0 z-0">
        <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-indigo-500/15 blur-3xl dark:bg-indigo-500/25"></div>
        <div class="absolute -bottom-36 -right-28 h-96 w-96 rounded-full bg-blue-500/10 blur-3xl dark:bg-blue-500/20"></div>
        <div class="absolute left-1/2 top-[85%] -translate-x-1/2 h-[28rem] w-[28rem] rounded-full bg-emerald-500/10 blur-3xl dark:bg-emerald-500/15"></div>
    </div>

    <div class="relative z-10">
        <div class="relative min-h-[100dvh] overflow-x-hidden overflow-y-auto">
            <div class="mx-auto flex min-h-[100dvh] w-full max-w-[1200px] items-center px-6 py-10 lg:px-16 lg:py-16">
                <div class="slide-content grid w-full grid-cols-1 items-center gap-12 lg:grid-cols-[1.1fr_0.9fr] lg:gap-16">
                    <!-- Text section -->
                    <div class="text-section z-10 text-center lg:text-left">
                        <div class="unit-badge mb-6 flex flex-wrap items-center justify-center gap-2 opacity-0 lg:justify-start">
                            <span class="inline-flex items-center rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[11px] font-black uppercase tracking-[0.2em] text-indigo-600 dark:border-indigo-800/50 dark:bg-indigo-900/30 dark:text-indigo-400">A1. Beginner</span>
                            <span class="inline-flex items-center rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[11px] font-black uppercase tracking-[0.2em] text-indigo-600 dark:border-indigo-800/50 dark:bg-indigo-900/30 dark:text-indigo-400">Unit.4</span>
                            <span class="inline-flex items-center rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[11px] font-black uppercase tracking-[0.2em] text-indigo-600 dark:border-indigo-800/50 dark:bg-indigo-900/30 dark:text-indigo-400">Home and Daily Needs</span>
                        </div>

                        <p class="lesson-label mb-2 text-sm font-black uppercase tracking-[0.35em] text-indigo-500 opacity-0 dark:text-indigo-400">Lesson.3</p>
                        <h1 class="hero-title mb-8 text-5xl font-black leading-[1.02] tracking-[-0.04em] sm:text-6xl lg:text-[5.5rem] opacity-0">
                            Paying <span class="bg-gradient-to-br from-indigo-600 to-blue-500 bg-clip-text text-transparent dark:from-indigo-400 dark:to-blue-300">Bills</span>
                        </h1>

                        <!-- Idiom card -->
                        <div class="idiom-card relative mb-8 inline-block max-w-[520px] rounded-[1.75rem] border border-indigo-100 bg-white/80 p-6 text-left opacity-0 shadow-[0_20px_50px_-20px_rgba(79,70,229,0.25)] backdrop-blur sm:p-8 dark:border-indigo-500/30 dark:bg-slate-800/80 lg:mx-0 mx-auto">
                            <span class="absolute -top-3 left-6 rounded-full bg-indigo-600 px-3 py-1 text-[9px] font-black uppercase tracking-[0.25em] text-white shadow-lg shadow-indigo-500/30 dark:bg-indigo-500">Idiom of the lesson</span>
                            <p class="idiom-quote text-xl font-black leading-snug tracking-tight text-slate-900 sm:text-2xl dark:text-slate-50">“Cut your coat according to your cloth”</p>
                            <p class="mt-3 text-sm font-medium leading-relaxed text-slate-500 dark:text-slate-400">Live in a way that matches what you can afford.</p>
                        </div>

                        <div class="flex items-center justify-center gap-6 opacity-0 lg:justify-start" id="cta-line">
                            <div class="h-px w-20 bg-indigo-200 dark:bg-indigo-800"></div>
                            <span class="text-xs font-black uppercase tracking-widest text-indigo-400 dark:text-indigo-500">Let's Get Started</span>
                        </div>
                    </div>

                    <!-- Image slot: photo of hands paying a bill on a smartphone (tech lead will host the real asset) -->
                    <div class="image-section relative flex items-center justify-center lg:justify-end">
                        <!-- IMAGE SLOT: replace inner block with <img src="img/slide-1-photo.png" class="h-full w-full object-cover" alt="..."> -->
                        <div class="img-slot group relative flex aspect-[4/5] w-full max-w-[420px] flex-col items-center justify-center gap-4 overflow-hidden rounded-[2.5rem] border-2 border-dashed border-indigo-200 bg-white/60 p-8 text-center shadow-[0_40px_80px_-40px_rgba(15,23,42,0.2)] backdrop-blur transition-colors dark:border-indigo-500/40 dark:bg-slate-800/60">
                            <div class="flex h-16 w-16 items-center justify-center rounded-2xl border border-indigo-100 bg-indigo-50 text-indigo-500 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A1.5 1.5 0 0021.75 19.5V4.5A1.5 1.5 0 0020.25 3H3.75A1.5 1.5 0 002.25 4.5v15A1.5 1.5 0 003.75 21z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-[0.25em] text-indigo-400 dark:text-indigo-500">Image Placeholder</p>
                                <p class="mt-2 text-xs font-bold leading-relaxed text-slate-500 dark:text-slate-400">Photo — paying a bill on a smartphone with a bank card</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const revealEls = document.querySelectorAll('.unit-badge, .lesson-label, .hero-title, .idiom-card, #cta-line, .image-section');

        function playIn() {
            if (!window.gsap) {
                revealEls.forEach((el) => {
                    el.style.opacity = '1';
                    el.style.transform = 'none';
                });
                return;
            }

            const tl = gsap.timeline();
            tl.to('.unit-badge', { opacity: 1, y: -10, duration: 0.5, ease: 'back.out(1.7)' });
            tl.to('.lesson-label', { opacity: 1, duration: 0.4 }, '-=0.2');
            tl.to('.hero-title', { opacity: 1, y: -15, duration: 0.6, ease: 'power4.out' }, '-=0.25');
            tl.to('.idiom-card', { opacity: 1, y: -10, duration: 0.55, ease: 'power3.out' }, '-=0.3');
            tl.to('#cta-line', { opacity: 1, duration: 0.5 }, '-=0.2');
            tl.fromTo('.image-section', { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out', clearProps: 'transform' }, '-=0.5');

            window.resetSlide = () => {
                tl.pause(0);
                gsap.set('.unit-badge, .lesson-label, .hero-title, .idiom-card, #cta-line, .image-section', { clearProps: 'all' });
                tl.restart();
            };
        }

        playIn();
    });
</script>
</body>
</html>
