<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };

        // Live theme sync with the reader: its toggle writes 'editor-theme-preference'
        // to localStorage, which fires a storage event inside every slide iframe.
        window.addEventListener('storage', function (event) {
            if (event.key === 'editor-theme-preference' && (event.newValue === 'dark' || event.newValue === 'light')) {
                document.documentElement.classList.toggle('dark', event.newValue === 'dark');
            }
        });
    </script>
    <link rel="stylesheet" href="bec.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-hidden">
<div class="bec-slide">
    <div class="bec-glow"></div>

    <div class="bec-stage" style="gap: clamp(0.8rem, 2.2vh, 1.6rem)">
        <!-- Unit badges -->
        <div class="reveal" style="display:flex;flex-wrap:wrap;justify-content:center;gap:0.45rem">
            <span class="bec-kicker">A1. Beginner</span>
            <span class="bec-kicker">Unit.4</span>
            <span class="bec-kicker">Home and Daily Needs</span>
        </div>

        <!-- Lesson title -->
        <div class="bec-header reveal">
            <span class="bec-kicker" style="background:transparent;border-color:transparent;letter-spacing:0.3em;color:var(--bec-text-2)">Lesson.3</span>
            <h1 class="bec-title" style="font-size:clamp(2.2rem,7.5vh,4.6rem)">Paying <span class="accent">Bills</span></h1>
        </div>

        <!-- Idiom of the lesson -->
        <div class="bec-card reveal" style="width:min(560px,100%);padding:clamp(0.8rem,2.4vh,1.4rem);text-align:center;position:relative">
            <span style="position:absolute;top:-0.65rem;left:50%;transform:translateX(-50%);background:var(--bec-brand);color:#fff;border-radius:9999px;padding:0.18rem 0.85rem;font-size:clamp(0.55rem,1.1vh,0.66rem);font-weight:900;letter-spacing:0.2em;text-transform:uppercase;box-shadow:0 8px 16px -8px rgba(79,70,229,0.6)">Idiom of the lesson</span>
            <p style="font-size:clamp(1rem,2.7vh,1.6rem);font-weight:900;letter-spacing:-0.01em;line-height:1.3">“Cut your coat according to your cloth”</p>
            <p style="margin-top:0.4rem;font-size:clamp(0.7rem,1.5vh,0.9rem);font-weight:600;color:var(--bec-text-2)">Live in a way that matches what you can afford.</p>
        </div>

        <!-- Start action -->
        <button class="bec-btn bec-btn-primary reveal" id="btn-start" style="padding:0.75rem 2.1rem;font-size:clamp(0.75rem,1.6vh,0.92rem)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            Start Lesson
        </button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('btn-start');
        btn.addEventListener('click', () => {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'BEC_NAV', action: 'next' }, '*');
                    return;
                }
            } catch (e) {}
            try {
                if (window.parent && typeof window.parent.nextSlide === 'function') {
                    window.parent.nextSlide();
                }
            } catch (e) {}
        });

        window.resetSlide = function resetSlide() {};

        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (window.gsap && !reduced) {
            gsap.timeline()
                .from('.bec-stage > .reveal', { opacity: 0, y: 12, duration: 0.35, stagger: 0.1, ease: 'power2.out', clearProps: 'all' });
        }
    });
</script>
</body>
</html>
