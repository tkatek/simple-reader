    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui']
                    }
                }
            }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}

            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }

            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .sentence-card {

        .sentence-card:hover {

        .sentence-card.is-speaking {

        }
        .speak-icon { transition: all 0.3s ease; }
        .sentence-card.is-speaking .speak-icon {
            background: #4f46e5;
            color: #fff;
            transform: scale(1.1);
        }
        @keyframes soundPulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }
        .sentence-card.is-speaking .sound-dot { animation: soundPulse 0.8s infinite; }
        .sentence-card.is-speaking .sound-dot:nth-child(2) { animation-delay: 0.2s; }
        .sentence-card.is-speaking .sound-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        function stopSpeaking() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            document.querySelectorAll('.sentence-card.is-speaking').forEach(c => c.classList.remove('is-speaking'));
        }

        document.querySelectorAll('.sentence-card').forEach(card => {
            card.addEventListener('click', () => {
                stopSpeaking();
                if (!window.speechSynthesis) return;
                card.classList.add('is-speaking');
                const u = new SpeechSynthesisUtterance(card.dataset.say);
                u.rate = 0.88;
                u.onend = () => card.classList.remove('is-speaking');
                u.onerror = () => card.classList.remove('is-speaking');
                window.speechSynthesis.speak(u);
            });
        });

        window.stopSlideAudio = stopSpeaking;

        function playIn() {
            const els = ['.header-section', '.sentence-card', '.image-section'];
            if (!window.gsap) {
                document.querySelectorAll(els.join(',')).forEach(el => { el.style.opacity = '1'; });
                return;
            }
            const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
            tl.to('.header-section', { opacity: 1, duration: 0.7 })
                .to('.sentence-card', { opacity: 1, x: -12, duration: 0.6, stagger: 0.13, clearProps: 'transform' }, '-=0.3')
                .fromTo('.image-section', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, clearProps: 'transform' }, '-=0.7');

            window.resetSlide = () => {
                tl.pause(0);
                gsap.set(els.join(','), { clearProps: 'all' });
                tl.restart();
                stopSpeaking();
            };
        }

        playIn();
    });
</script>
