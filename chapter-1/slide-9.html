<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'] } } }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}
            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }
            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };

        // Live theme sync with the reader: its toggle writes 'editor-theme-preference'
        // to localStorage, which fires a storage event inside every slide iframe.
        window.addEventListener('storage', function (event) {
            if (event.key === 'editor-theme-preference' && (event.newValue === 'dark' || event.newValue === 'light')) {
                document.documentElement.classList.toggle('dark', event.newValue === 'dark');
            }
        });
    </script>
    <link rel="stylesheet" href="bec.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="h-full overflow-hidden">
<div class="bec-slide">
    <div class="bec-glow"></div>

    <div class="bec-stage" style="gap: clamp(0.7rem, 2vh, 1.2rem)">
        <div class="bec-header reveal">
            <span class="bec-kicker">Slide 09 · Useful Phrases</span>
            <h1 class="bec-title">New <span class="accent">Language;</span></h1>
            <p class="bec-sub">Tap a phrase to hear it — audio will be connected by your teacher.</p>
        </div>

        <!-- ═══ TECH LEAD — AUDIO INTEGRATION ═════════════════════════
             Each row carries data-say (the phrase) and an empty data-audio.
             Set data-audio to the hosted audio URL per phrase (or fill
             PHRASE_AUDIO below with a {phrase: url} map) and the speaker
             buttons enable automatically. No TTS fallback by design. -->
        <div class="bec-phrase-list">
            <div class="bec-card bec-phrase-row reveal">
                <button class="bec-speak" data-say="Your total is...." data-audio="" aria-label="Listen: Your total is...." disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                </button>
                <p class="bec-phrase-text">Your total is....</p>
            </div>
            <div class="bec-card bec-phrase-row reveal">
                <button class="bec-speak" data-say="pay by card /cash/ check" data-audio="" aria-label="Listen: pay by card, cash, check" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                </button>
                <p class="bec-phrase-text">pay by card /cash/ check</p>
            </div>
            <div class="bec-card bec-phrase-row reveal">
                <button class="bec-speak" data-say="Insert your card" data-audio="" aria-label="Listen: Insert your card" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                </button>
                <p class="bec-phrase-text">Insert your card</p>
            </div>
            <div class="bec-card bec-phrase-row reveal">
                <button class="bec-speak" data-say="Here’s your receipt." data-audio="" aria-label="Listen: Here's your receipt." disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                </button>
                <p class="bec-phrase-text">Here’s your receipt.</p>
            </div>
            <div class="bec-card bec-phrase-row reveal">
                <button class="bec-speak" data-say="I would like to open a bank account" data-audio="" aria-label="Listen: I would like to open a bank account" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                </button>
                <p class="bec-phrase-text">I would like to open a bank account</p>
            </div>
        </div>
    </div>
</div>

<script>
    /* ═══ TECH LEAD: optional map of phrase → hosted audio URL, e.g.
       const PHRASE_AUDIO = { "Insert your card": "https://host/a/insert.mp3" };
       When a phrase has a URL here (or in its data-audio attribute), its
       speaker button enables and plays the real recording. ═══ */
    const PHRASE_AUDIO = {};

    document.addEventListener('DOMContentLoaded', () => {
        let current = null;
        document.querySelectorAll('.bec-speak').forEach(btn => {
            const src = btn.dataset.audio || PHRASE_AUDIO[btn.dataset.say];
            if (src) {
                btn.disabled = false;
                const audio = new Audio(src);
                audio.preload = 'metadata';
                btn.addEventListener('click', () => {
                    if (current && current !== audio) { current.pause(); current.currentTime = 0; }
                    if (!audio.paused) { audio.pause(); audio.currentTime = 0; }
                    else { current = audio; audio.play(); }
                });
            }
        });

        window.stopSlideAudio = function stopSlideAudio() { if (current) { current.pause(); current.currentTime = 0; } };
        window.resetSlide = function resetSlide() {};

        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (window.gsap && !reduced) {
            gsap.timeline().from('.reveal', { opacity: 0, y: 10, duration: 0.3, stagger: 0.08, ease: 'power2.out', clearProps: 'all' });
        }
    });
</script>
</body>
</html>
